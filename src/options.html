<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click to Markdown settings</title>
  <style>
    body { margin: 0; background: #f5f5f5; color: #202124; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 56px auto; padding: 0 24px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #5f6368; line-height: 1.5; }
    section { margin-top: 28px; padding: 20px 0; border-top: 1px solid #dadce0; }
    h2 { margin: 0 0 8px; font-size: 17px; }
    .shortcut { display: inline-block; margin: 8px 0; padding: 6px 10px; border-radius: 5px; background: #e8f0fe; color: #174ea6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    button { margin-top: 8px; padding: 10px 14px; border: 0; border-radius: 6px; background: #1a73e8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Click to Markdown</h1>
    <p>Capture a single element with a click, or drag across any area to copy its contents as Markdown.</p>
    <section>
      <h2>Keyboard shortcut</h2>
      <p>Start or cancel capture with <span class="shortcut" id="shortcut">Not assigned</span>.</p>
      <p>Chrome manages keyboard shortcuts, so you can choose any available combination there.</p>
      <button id="openShortcuts">Configure shortcut</button>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
